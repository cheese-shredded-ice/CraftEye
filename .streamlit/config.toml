[server]
address = "127.0.0.1"
port = 8501
# Streamlit requires an integer limit (MB); use its protobuf int32 maximum.
# This removes the practical application cap; available memory/disk still apply.
maxUploadSize = 2147483647
headless = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0d9488"
