plugins { id 'com.android.application' }

android {
    namespace 'cn.local.welding'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.local.welding'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file('../.signing/welding-release.jks')
            storePassword System.getenv('WELDING_KEY_PASSWORD')
            keyAlias 'welding'
            keyPassword System.getenv('WELDING_KEY_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['onnx'] }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    testImplementation 'junit:junit:4.13.2'
}
